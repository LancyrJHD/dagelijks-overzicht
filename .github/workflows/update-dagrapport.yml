name: Update Lancyr Dagrapport

on:
  schedule:
    # Elk half uur op werkdagen tussen 07:00 en 18:00 Amsterdam (05:00-16:00 UTC)
    - cron: '0,30 5-16 * * 1-5'
  workflow_dispatch:   # Handmatig triggeren vanuit GitHub
    inputs:
      datum:
        description: 'Zoom: datum (YYYY-MM-DD) om op te halen, leeg = vandaag'
        required: false
        default: ''
      diagnose_nummer:
        description: 'Zoom: DIAGNOSE-ONLY -- volledig record dumpen voor dit nummer, niets opslaan (leeg = normale run)'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Nodig om te kunnen committen en pushen
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Haal Zoho Desk-tickets op
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
        run: python scripts/fetch_zoho_tickets.py
        continue-on-error: true  # Zoho-storing mag de Granola-update niet blokkeren
        # Draait bewust VOOR de Granola-AI-analyse: die gebruikt de Zoho-tickets
        # om te zien of een beller automatisch is herkend op telefoonnummer.
      - name: Haal Zoom Phone gemiste oproepen op
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          ZOOM_DATE: ${{ github.event.inputs.datum }}
          ZOOM_DIAGNOSE_ONLY: ${{ github.event.inputs.diagnose_nummer != '' }}
          ZOOM_DIAGNOSE_NUMBER: ${{ github.event.inputs.diagnose_nummer }}
        run: python scripts/fetch_zoom_calls.py
        continue-on-error: true  # Zoom-storing mag de rest van het dagrapport niet blokkeren
      - name: Analyseer Granola-gesprekken met AI
        env:
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze_granola_ai.py
      - name: Commit en push data/*.json
        run: |
          git config user.name  "Lancyr Bot"
          git config user.email "bot@htjz.nl"
          git add data/today.json data/zoho-tickets.json
          # data/zoom-calls.json bestaat pas na de eerste geslaagde Zoom-fetch
          # (script slaat niets op bij ontbrekende secrets) -- guard voorkomt
          # dat "git add" op een niet-bestaand bestand de hele stap laat falen
          # onder bash's set -e (GitHub Actions default).
          if [ -f data/zoom-calls.json ]; then git add data/zoom-calls.json; fi
          if [ -f data/zoom-history.json ]; then git add data/zoom-history.json; fi
          # Alleen committen als er iets veranderd is
          # git pull --rebase vlak voor de push voorkomt dat deze stap faalt
          # wanneer een andere run (bv. handmatig gestart terwijl de geplande
          # run ook loopt) intussen al heeft gepusht (bevinding 25 aug 2026).
          git diff --staged --quiet && echo "Geen wijzigingen" || \
            git commit -m "auto: lancyr dagrapport $(date -u '+%Y-%m-%d %H:%M UTC')" && \
            git pull --rebase --autostash -q && \
            git push
